<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Moje ćelije')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
    <h1>Moje ćelije </h1>

    <div class="success" th:if="${message}" th:text="${message}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <h3>Donesi novi med (Upload)</h3>
        <form th:action="@{/files/upload(_csrf=${_csrf.token})}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Donesi med</button>
        </form>
    </div>

    <div th:if="${!files.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Naziv</th>
                <th>Veličina</th>
                <th>Datum uploada</th>
                <th>Akcije</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${files}">
                <td th:text="${f.originalName}"></td>
                <td th:text="${#numbers.formatDecimal(f.sizeBytes / 1048576.0, 1, 2)} + ' MB'"></td>
                <td th:text="${#temporals.format(f.uploadedAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td class="actions">
                    <a th:href="@{/files/{id}/download(id=${f.id})}" class="btn" style="padding: 6px 12px; font-size: 0.85rem;">Preuzmi</a>
                    <form th:action="@{/files/{id}/delete(id=${f.id})}" method="post" class="inline">
                        <button type="submit" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.85rem;">Obriši</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card" th:if="${files.isEmpty()}">
        <p>Košnica je prazna. Donesi prvi med!</p>
    </div>
</main>
</body>
</html>
