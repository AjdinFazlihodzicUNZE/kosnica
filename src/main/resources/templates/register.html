<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registracija')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
    <h1>Postani pčelar 🐝</h1>
    <form th:action="@{/register}" th:object="${form}" method="post" class="card">
        <label>Ime i prezime</label><br>
        <input type="text" th:field="*{fullName}">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        <br>
        <label>Email</label><br>
        <input type="text" th:field="*{email}">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <br>
        <label>Lozinka</label><br>
        <input type="password" th:field="*{password}">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <br>
        <button type="submit">Registruj se</button>
    </form>
</main>
</body>
</html>
