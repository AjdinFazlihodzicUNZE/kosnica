<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Prijava')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
    <div class="card" style="max-width: 480px; margin: 0 auto;">
        <h1>Prijava 🔑</h1>

        <div class="error" th:if="${param.error}">Pogrešan email ili lozinka.</div>
        <div class="success" th:if="${param.registered}">Registracija uspješna, prijavi se!</div>

        <form th:action="@{/login}" method="post">
            <label for="email">Email adresa</label>
            <input type="text" id="email" name="email" required placeholder="pcelar@example.com">

            <label for="password">Lozinka</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" style="width: 100%;">Prijavi se</button>
        </form>
    </div>
</main>
</body>
</html>
