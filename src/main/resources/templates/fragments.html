<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Košnica'">Košnica</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar">
    <a th:href="@{/}" class="brand">🐝 Košnica</a>
    <div>
        <span th:if="${loggedIn}">
            <a th:href="@{/dashboard}">Početna</a>
            <a th:href="@{/files}">Moje ćelije</a>
            <a th:href="@{/billing}">Naplata</a>
            <a th:href="@{/usage}">Potrošnja</a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit">Odjava</button>
            </form>
        </span>
        <span th:unless="${loggedIn}">
            <a th:href="@{/login}">Prijava</a>
            <a th:href="@{/register}">Registracija</a>
        </span>
    </div>
</nav>
</body>
</html>
